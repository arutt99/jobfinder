name: Fixture CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        base: ["/", "/jobfinder/"]
    env:
      VITE_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run test:integration
      - run: npm run demo && npm run build
      - run: npm run artifact:check
        env:
          ALLOW_DEMO_ARTIFACT: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-diagnostics-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7
